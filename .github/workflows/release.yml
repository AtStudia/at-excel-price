name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WordPress plugin zip
        run: |
          stage="${RUNNER_TEMP}/at-excel-price"
          rm -rf "$stage"
          mkdir -p "$stage"
          rsync -a --exclude '.git' --exclude '.github' "$GITHUB_WORKSPACE/" "$stage/"
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/at-excel-price.zip" at-excel-price

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: at-excel-price.zip
          generate_release_notes: true
